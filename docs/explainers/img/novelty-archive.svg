    <line x1="276.4" y1="184.4" x2="211.3" y2="238.9"/>
    <line x1="276.4" y1="184.4" x2="160.9" y2="214.7"/>
  </g>
  <!-- archive (earlier behaviours) and this generation -->
  <g class="arc">
    <circle cx="180.7" cy="316.8" r="3.4"/><circle cx="181.5" cy="329.7" r="3.4"/><circle cx="161.4" cy="328.1" r="3.4"/><circle cx="219.8" cy="318.2" r="3.4"/>
    <circle cx="217.7" cy="320.9" r="3.4"/><circle cx="140.4" cy="311.5" r="3.4"/><circle cx="162.6" cy="332.1" r="3.4"/><circle cx="202.9" cy="334.8" r="3.4"/>
    <circle cx="169.1" cy="298" r="3.4"/><circle cx="203.9" cy="306.1" r="3.4"/><circle cx="170.3" cy="336.3" r="3.4"/><circle cx="178.2" cy="326.5" r="3.4"/>
    <circle cx="175.2" cy="339.7" r="3.4"/><circle cx="173.1" cy="305.8" r="3.4"/><circle cx="164.9" cy="321" r="3.4"/><circle cx="200.2" cy="348" r="3.4"/>
    <circle cx="189.4" cy="304.4" r="3.4"/><circle cx="130.4" cy="329.8" r="3.4"/><circle cx="185" cy="337.5" r="3.4"/><circle cx="202.2" cy="325.8" r="3.4"/>
    <circle cx="146.1" cy="311.9" r="3.4"/><circle cx="207.1" cy="310" r="3.4"/><circle cx="229.2" cy="319.1" r="3.4"/><circle cx="191.4" cy="345.1" r="3.4"/>
    <circle cx="205.6" cy="334.3" r="3.4"/><circle cx="175.1" cy="344.5" r="3.4"/><circle cx="160.3" cy="333.1" r="3.4"/><circle cx="146.3" cy="321.1" r="3.4"/>
    <circle cx="229.3" cy="315.8" r="3.4"/><circle cx="198.2" cy="336.3" r="3.4"/><circle cx="118.5" cy="208.2" r="3.4"/><circle cx="153.2" cy="223.1" r="3.4"/>
    <circle cx="139.8" cy="218.1" r="3.4"/><circle cx="160.9" cy="214.7" r="3.4"/><circle cx="144.1" cy="216" r="3.4"/><circle cx="111.5" cy="202.7" r="3.4"/>
    <circle cx="150.9" cy="216.4" r="3.4"/><circle cx="105.2" cy="237.5" r="3.4"/><circle cx="133.1" cy="207.4" r="3.4"/><circle cx="115.5" cy="196.7" r="3.4"/>
    <circle cx="144.6" cy="228.7" r="3.4"/><circle cx="141.1" cy="214.2" r="3.4"/><circle cx="137.9" cy="205.1" r="3.4"/><circle cx="125.7" cy="233.5" r="3.4"/>
    <circle cx="261.7" cy="235.9" r="3.4"/><circle cx="221.7" cy="219.2" r="3.4"/><circle cx="211.3" cy="238.9" r="3.4"/><circle cx="236.9" cy="241.8" r="3.4"/>
    <circle cx="223.6" cy="224.9" r="3.4"/><circle cx="247.2" cy="233.8" r="3.4"/><circle cx="243.2" cy="225.9" r="3.4"/><circle cx="236.3" cy="231.4" r="3.4"/>
    <circle cx="97.1" cy="315.5" r="3.4"/><circle cx="119.4" cy="276.8" r="3.4"/><circle cx="102.6" cy="183.9" r="3.4"/><circle cx="232.7" cy="316" r="3.4"/>
    <circle cx="177.5" cy="320.6" r="3.4"/><circle cx="116" cy="324.4" r="3.4"/><circle cx="172.7" cy="294.8" r="3.4"/><circle cx="280.2" cy="313.6" r="3.4"/>
    <circle cx="102.1" cy="169.9" r="3.4"/><circle cx="213.7" cy="316.3" r="3.4"/><circle cx="217" cy="338.1" r="3.4"/><circle cx="213.7" cy="164.9" r="3.4"/>
  </g>
  <g class="gen">
    <circle cx="216.7" cy="330.7" r="3.4"/><circle cx="200" cy="305.8" r="3.4"/><circle cx="214.4" cy="299.6" r="3.4"/><circle cx="174.5" cy="321.1" r="3.4"/>
