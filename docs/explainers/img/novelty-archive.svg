  </g>
  <circle cx="276.4" cy="184.4" r="7" fill="#ffffff" stroke="#3aa76d" stroke-width="3"/>
  <circle cx="198.4" cy="317" r="7" fill="#ffffff" stroke="#5b6b7a" stroke-width="3"/>
  <text class="lab b" x="261" y="125" text-anchor="middle" style="fill:#1f7a4a">lonely try: long lines,</text>
  <text class="lab b" x="261" y="142" text-anchor="middle" style="fill:#1f7a4a">high novelty</text>
  <line x1="198.4" y1="308" x2="216.4" y2="289" stroke="#5b6b7a" stroke-width="1"/>
  <text class="lab b" x="231" y="265" text-anchor="middle" style="fill:#3d4a57">crowded try: short lines,</text>
  <text class="lab b" x="231" y="281" text-anchor="middle" style="fill:#3d4a57">low novelty</text>

  <line class="axis" x1="84" y1="96" x2="84" y2="356"/>
  <line class="axis" x1="84" y1="356" x2="344" y2="356"/>
  <g class="tick" text-anchor="end">
    <text x="76" y="100">1</text><text x="76" y="230">0.5</text><text x="76" y="360">0</text>
  </g>
  <g class="tick" text-anchor="middle">
    <text x="84" y="374">0</text><text x="214" y="374">0.5</text><text x="344" y="374">1</text>
  </g>
  <text class="sm" x="32" y="86">time below 5 m (share of mid-flight)</text>
  <text class="sm" x="214" y="394" text-anchor="middle">flight time (share of the time limit)</text>

  <rect x="372" y="96" width="356" height="282" rx="12" fill="#ffffff" stroke="#e3e8ee"/>
  <text class="lab b" x="390" y="122">How novelty is scored</text>
  <text class="lab b" x="390" y="150">1</text>
  <text class="lab" x="408" y="150">Find the 10 nearest behaviours: in the</text>
  <text class="lab" x="408" y="168">archive and in this generation (not itself).</text>
  <text class="lab b" x="390" y="195">2</text>
  <text class="lab" x="408" y="195">Novelty is their average distance.</text>
  <text class="lab b" x="390" y="222">3</text>
  <text class="lab" x="408" y="222">Divide by a running average: a typical</text>
  <text class="lab" x="408" y="240">try scores about 1, the oddest at most 3.</text>
  <text class="lab b" x="390" y="267">4</text>
  <text class="lab" x="408" y="267">Rank by score + 0.5 × novelty. The star</text>
  <text class="lab" x="408" y="285">is still the best plain score.</text>
  <text class="lab b" x="390" y="312">5</text>
  <text class="lab" x="408" y="312">The 3 most novel join the archive</text>
  <text class="lab" x="408" y="330">(up to 2,000, then a random one is replaced).</text>
  <text class="sm" x="390" y="363">Swarm: share caught or leaked, and battle time.</text>

  <circle cx="90" cy="426" r="4" fill="#9aa7b4"/><text class="sm" x="100" y="430">archive: earlier behaviours</text>
  <circle cx="282" cy="426" r="4" fill="#2b8cc4"/><text class="sm" x="292" y="430">this generation</text>
  <circle cx="428" cy="426" r="6" fill="#ffffff" stroke="#3aa76d" stroke-width="2.5"/><text class="sm" x="440" y="430">lonely: high novelty</text>
  <circle cx="590" cy="426" r="6" fill="#ffffff" stroke="#5b6b7a" stroke-width="2.5"/><text class="sm" x="602" y="430">crowded: low novelty</text>
</svg>
