    <circle cx="199.6" cy="299.1" r="3.4"/><circle cx="217.4" cy="320.4" r="3.4"/><circle cx="243.8" cy="330.4" r="3.4"/><circle cx="215.3" cy="320.1" r="3.4"/>
    <circle cx="203.1" cy="308.8" r="3.4"/><circle cx="204.5" cy="309.5" r="3.4"/><circle cx="177.2" cy="334.7" r="3.4"/><circle cx="210.6" cy="328.3" r="3.4"/>
    <circle cx="185" cy="334.2" r="3.4"/><circle cx="220.8" cy="308.3" r="3.4"/><circle cx="224" cy="328" r="3.4"/><circle cx="201" cy="330.3" r="3.4"/>
    <circle cx="213" cy="298.4" r="3.4"/><circle cx="187.1" cy="298.7" r="3.4"/><circle cx="216.4" cy="319.1" r="3.4"/><circle cx="170.2" cy="300.5" r="3.4"/>
    <circle cx="207.2" cy="312.2" r="3.4"/><circle cx="224.4" cy="328.9" r="3.4"/><circle cx="218.7" cy="299.6" r="3.4"/><circle cx="223.7" cy="319.1" r="3.4"/>
    <circle cx="189.4" cy="305.1" r="3.4"/><circle cx="223.2" cy="320.1" r="3.4"/><circle cx="165.2" cy="321.5" r="3.4"/><circle cx="172.1" cy="307.4" r="3.4"/>
    <circle cx="205.9" cy="324.2" r="3.4"/><circle cx="200.9" cy="307.3" r="3.4"/>
  </g>
  <g class="lb">
    <line x1="198.4" y1="317" x2="203.1" y2="308.8"/>
    <line x1="198.4" y1="317" x2="202.2" y2="325.8"/>
    <line x1="198.4" y1="317" x2="204.5" y2="309.5"/>
    <line x1="198.4" y1="317" x2="200.9" y2="307.3"/>
    <line x1="198.4" y1="317" x2="207.2" y2="312.2"/>
    <line x1="198.4" y1="317" x2="205.9" y2="324.2"/>
    <line x1="198.4" y1="317" x2="207.1" y2="310"/>
    <line x1="198.4" y1="317" x2="200" y2="305.8"/>
    <line x1="198.4" y1="317" x2="203.9" y2="306.1"/>
