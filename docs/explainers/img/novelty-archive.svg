<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" width="760" height="446" role="img" aria-labelledby="t d">
  <title id="t">Novelty: how far a try is from what has been seen</title>
  <desc id="d">Behaviour space: flight time across, time below 5 m up. Grey dots are the archive of earlier behaviours, blue dots this generation's tries, most of them crowded low on the chart, in the middle. A lonely try far from the crowd has long lines to its 10 nearest neighbours and a high novelty. A try inside the crowd has short lines and a low novelty. A side panel lists the five steps of the novelty score.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1d2733; }
    .h { font-size: 19px; font-weight: 600; }
    .sub { font-size: 13px; fill: #5b6b7a; }
    .ph { font-size: 15px; font-weight: 600; }
    .lab { font-size: 13px; }
    .b { font-weight: 600; }
    .sm { font-size: 12px; fill: #5b6b7a; }
    .tick { font-size: 12px; fill: #5b6b7a; }
    .axis { stroke: #9aa7b4; stroke-width: 1.3; }
    .arc { fill: #9aa7b4; }
    .gen { fill: #2b8cc4; }
    .la { stroke: #3aa76d; stroke-width: 1.6; }
    .lb { stroke: #5b6b7a; stroke-width: 1.3; }
  </style>

  <rect x="1" y="1" width="758" height="444" rx="16" fill="#f8fafc" stroke="#dde3ea"/>
  <text class="h" x="32" y="42">Novelty: how far a try is from what has been seen</text>
  <text class="sub" x="32" y="66">Each dot is one network's behaviour. Novelty is the average distance to its 10 nearest neighbours.</text>

  <rect x="84" y="96" width="260" height="260" fill="#ffffff"/>
  <g stroke="#e6ebf0" stroke-width="1">
    <line x1="84" y1="226" x2="344" y2="226"/><line x1="214" y1="96" x2="214" y2="356"/>
    <line x1="84" y1="96" x2="344" y2="96"/><line x1="344" y1="96" x2="344" y2="356"/>
  </g>
  <!-- the 10 nearest neighbours of each marked try -->
  <g class="la">
    <line x1="276.4" y1="184.4" x2="243.2" y2="225.9"/>
    <line x1="276.4" y1="184.4" x2="261.7" y2="235.9"/>
    <line x1="276.4" y1="184.4" x2="247.2" y2="233.8"/>
    <line x1="276.4" y1="184.4" x2="236.3" y2="231.4"/>
    <line x1="276.4" y1="184.4" x2="221.7" y2="219.2"/>
