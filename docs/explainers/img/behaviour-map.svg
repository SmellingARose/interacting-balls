<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" role="img" aria-labelledby="t d">
  <title id="t">Behaviour map: the best network of every kind</title>
  <desc id="d">A 10 by 10 grid over the two behaviour numbers: flight time across, time below 5 m up. Filled cells hold an elite, shaded darker the higher its score; empty cells are white. Three new tries are marked. One lands in an empty cell and ranks first. One beats the elite of its cell and ranks next. One does neither and ranks last. A side panel explains the ranking; an island that improves no cell for 10 generations restarts from a random elite.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1d2733; }
    .h { font-size: 19px; font-weight: 600; }
    .sub { font-size: 13px; fill: #5b6b7a; }
    .ph { font-size: 15px; font-weight: 600; }
    .lab { font-size: 13px; }
    .b { font-weight: 600; }
    .sm { font-size: 12px; fill: #5b6b7a; }
    .tick { font-size: 12px; fill: #5b6b7a; }
    .axis { stroke: #9aa7b4; stroke-width: 1.3; }
    .cell { fill: #2b8cc4; }
  </style>
  <defs>
    <linearGradient id="sc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b8cc4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2b8cc4" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="758" height="450" rx="16" fill="#f8fafc" stroke="#dde3ea"/>
  <text class="h" x="32" y="42">Behaviour map: the best network of every kind</text>
  <text class="sub" x="32" y="66">A 10 × 10 grid over the two behaviour numbers. Each filled cell keeps its elite: the best score seen there.</text>

  <rect x="84" y="96" width="260" height="260" fill="#ffffff"/>
  <!-- elites: darker is a higher score -->
  <g class="cell">
    <rect x="111" y="331" width="24" height="24" rx="2" fill-opacity="0.71"/>
    <rect x="137" y="331" width="24" height="24" rx="2" fill-opacity="0.83"/>
    <rect x="163" y="331" width="24" height="24" rx="2" fill-opacity="0.90"/>
    <rect x="189" y="331" width="24" height="24" rx="2" fill-opacity="0.83"/>
    <rect x="215" y="331" width="24" height="24" rx="2" fill-opacity="0.74"/>
    <rect x="241" y="331" width="24" height="24" rx="2" fill-opacity="0.60"/>
    <rect x="267" y="331" width="24" height="24" rx="2" fill-opacity="0.50"/>
    <rect x="111" y="305" width="24" height="24" rx="2" fill-opacity="0.66"/>
    <rect x="137" y="305" width="24" height="24" rx="2" fill-opacity="0.69"/>
    <rect x="163" y="305" width="24" height="24" rx="2" fill-opacity="0.78"/>
    <rect x="189" y="305" width="24" height="24" rx="2" fill-opacity="0.76"/>
    <rect x="215" y="305" width="24" height="24" rx="2" fill-opacity="0.62"/>
    <rect x="241" y="305" width="24" height="24" rx="2" fill-opacity="0.57"/>
    <rect x="267" y="305" width="24" height="24" rx="2" fill-opacity="0.44"/>
    <rect x="111" y="279" width="24" height="24" rx="2" fill-opacity="0.53"/>
    <rect x="137" y="279" width="24" height="24" rx="2" fill-opacity="0.57"/>
    <rect x="163" y="279" width="24" height="24" rx="2" fill-opacity="0.71"/>
    <rect x="189" y="279" width="24" height="24" rx="2" fill-opacity="0.64"/>
    <rect x="215" y="279" width="24" height="24" rx="2" fill-opacity="0.52"/>
    <rect x="241" y="279" width="24" height="24" rx="2" fill-opacity="0.45"/>
    <rect x="137" y="253" width="24" height="24" rx="2" fill-opacity="0.51"/>
    <rect x="163" y="253" width="24" height="24" rx="2" fill-opacity="0.55"/>
    <rect x="189" y="253" width="24" height="24" rx="2" fill-opacity="0.52"/>
    <rect x="215" y="253" width="24" height="24" rx="2" fill-opacity="0.42"/>
    <rect x="241" y="253" width="24" height="24" rx="2" fill-opacity="0.30"/>
    <rect x="163" y="227" width="24" height="24" rx="2" fill-opacity="0.43"/>
    <rect x="189" y="227" width="24" height="24" rx="2" fill-opacity="0.42"/>
    <rect x="215" y="227" width="24" height="24" rx="2" fill-opacity="0.30"/>
    <rect x="163" y="201" width="24" height="24" rx="2" fill-opacity="0.39"/>
    <rect x="189" y="201" width="24" height="24" rx="2" fill-opacity="0.32"/>
    <rect x="241" y="201" width="24" height="24" rx="2" fill-opacity="0.12"/>
    <rect x="189" y="175" width="24" height="24" rx="2" fill-opacity="0.21"/>
  </g>
  <g stroke="#e6ebf0" stroke-width="1">
    <line x1="84" y1="96" x2="84" y2="356"/><line x1="84" y1="96" x2="344" y2="96"/>
    <line x1="110" y1="96" x2="110" y2="356"/><line x1="84" y1="122" x2="344" y2="122"/>
    <line x1="136" y1="96" x2="136" y2="356"/><line x1="84" y1="148" x2="344" y2="148"/>
    <line x1="162" y1="96" x2="162" y2="356"/><line x1="84" y1="174" x2="344" y2="174"/>
    <line x1="188" y1="96" x2="188" y2="356"/><line x1="84" y1="200" x2="344" y2="200"/>
    <line x1="214" y1="96" x2="214" y2="356"/><line x1="84" y1="226" x2="344" y2="226"/>
    <line x1="240" y1="96" x2="240" y2="356"/><line x1="84" y1="252" x2="344" y2="252"/>
    <line x1="266" y1="96" x2="266" y2="356"/><line x1="84" y1="278" x2="344" y2="278"/>
    <line x1="292" y1="96" x2="292" y2="356"/><line x1="84" y1="304" x2="344" y2="304"/>
    <line x1="318" y1="96" x2="318" y2="356"/><line x1="84" y1="330" x2="344" y2="330"/>
    <line x1="344" y1="96" x2="344" y2="356"/><line x1="84" y1="356" x2="344" y2="356"/>
  </g>
  <!-- three new tries -->
  <circle cx="175" cy="187" r="9" fill="#3aa76d" stroke="#ffffff" stroke-width="2"/><text class="sm b" x="175" y="191" text-anchor="middle" style="fill:#ffffff">1</text>
  <circle cx="149" cy="317" r="9" fill="#1d2733" stroke="#ffffff" stroke-width="2"/><text class="sm b" x="149" y="321" text-anchor="middle" style="fill:#ffffff">2</text>
  <circle cx="253" cy="343" r="9" fill="#9aa7b4" stroke="#ffffff" stroke-width="2"/><text class="sm b" x="253" y="347" text-anchor="middle" style="fill:#ffffff">3</text>

  <line class="axis" x1="84" y1="96" x2="84" y2="356"/>
  <line class="axis" x1="84" y1="356" x2="344" y2="356"/>
  <g class="tick" text-anchor="end">
    <text x="76" y="100">1</text><text x="76" y="230">0.5</text><text x="76" y="360">0</text>
  </g>
  <g class="tick" text-anchor="middle">
    <text x="84" y="374">0</text><text x="214" y="374">0.5</text><text x="344" y="374">1</text>
  </g>
  <text class="sm" x="32" y="86">time below 5 m (share of mid-flight)</text>
  <text class="sm" x="214" y="394" text-anchor="middle">flight time (share of the time limit)</text>

  <rect x="372" y="96" width="356" height="260" rx="12" fill="#ffffff" stroke="#e3e8ee"/>
  <text class="lab b" x="390" y="122">How an island ranks its tries (CMA-ME)</text>
  <circle cx="399" cy="148" r="9" fill="#3aa76d"/><text class="sm b" x="399" y="152" text-anchor="middle" style="fill:#ffffff">1</text>
  <text class="lab" x="418" y="152">Fills an empty cell: ranks first,</text>
  <text class="lab" x="418" y="170">higher scores before lower ones.</text>
  <circle cx="399" cy="200" r="9" fill="#1d2733"/><text class="sm b" x="399" y="204" text-anchor="middle" style="fill:#ffffff">2</text>
  <text class="lab" x="418" y="204">Beats its cell's elite: next,</text>
  <text class="lab" x="418" y="222">the bigger the gain, the higher.</text>
  <circle cx="399" cy="252" r="9" fill="#9aa7b4"/><text class="sm b" x="399" y="256" text-anchor="middle" style="fill:#ffffff">3</text>
  <text class="lab" x="418" y="256">Neither: last, the closer to its</text>
  <text class="lab" x="418" y="274">cell's elite, the higher.</text>
  <text class="sm" x="390" y="310">The optimizer moves toward the top of this ranking.</text>
  <text class="sm" x="390" y="328">Then each cell keeps the better of its elite and</text>
  <text class="sm" x="390" y="344">this generation's best try that landed in it.</text>

  <rect x="372" y="382" width="14" height="14" rx="2" fill="#ffffff" stroke="#cfd7df"/><text class="sm" x="394" y="393">empty cell</text>
  <text class="sm" x="484" y="393">elite score: low</text>
  <rect x="582" y="382" width="100" height="14" rx="2" fill="url(#sc)"/><text class="sm" x="690" y="393">high</text>
  <text class="sm" x="32" y="434">An island that fills or improves no cell for 10 generations starts again from a random elite.</text>
</svg>
