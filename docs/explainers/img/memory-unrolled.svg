<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 410" width="760" height="410" role="img" aria-labelledby="t d">
  <title id="t">Memory neurons, unrolled over three decisions</title>
  <desc id="d">The same network is drawn three times, once per decision. Each time it reads 29 sensor values plus 32 memory values, passes them through a hidden layer and outputs throttle, pitch and yaw. The hidden layer's values are copied forward and become the memory inputs of the next decision.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1d2733; }
    .h { font-size: 19px; font-weight: 600; }
    .sub { font-size: 13px; fill: #5b6b7a; }
    .lab { font-size: 13px; }
    .sm { font-size: 12px; fill: #5b6b7a; }
    .up { stroke: #5b6b7a; stroke-width: 1.6; }
    .mem { fill: none; stroke: #3aa76d; stroke-width: 2.4; stroke-dasharray: 6 4; }
    .out { fill: #eef1f4; stroke: #9aa7b4; stroke-width: 1.4; }
    .hid { fill: #e3f0f8; stroke: #2b8cc4; stroke-width: 1.6; }
    .sen { fill: #e3f0f8; stroke: #2b8cc4; stroke-width: 1.4; }
    .mbox { fill: #e2f3ea; stroke: #3aa76d; stroke-width: 1.4; }
    .n { fill: #ffffff; stroke: #2b8cc4; stroke-width: 1.4; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3aa76d"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
    </marker>
    <g id="col">
      <rect class="out" x="-80" y="100" width="160" height="36" rx="8"/>
      <text class="lab" x="0" y="123" text-anchor="middle">throttle · pitch · yaw</text>
      <rect class="hid" x="-90" y="174" width="180" height="52" rx="10"/>
      <circle class="n" cx="-50" cy="191" r="6"/><circle class="n" cx="-30" cy="191" r="6"/><circle class="n" cx="-10" cy="191" r="6"/>
      <circle class="n" cx="10" cy="191" r="6"/><circle class="n" cx="30" cy="191" r="6"/><circle class="n" cx="50" cy="191" r="6"/>
      <text class="sm" x="0" y="217" text-anchor="middle">hidden layer · 32</text>
      <rect class="mbox" x="-88" y="268" width="84" height="36" rx="8"/>
      <text class="lab" x="-46" y="291" text-anchor="middle">memory 32</text>
      <rect class="sen" x="4" y="268" width="84" height="36" rx="8"/>
      <text class="lab" x="46" y="291" text-anchor="middle">sensors 29</text>
      <line class="up" x1="-46" y1="268" x2="-46" y2="230" marker-end="url(#ak)"/>
      <line class="up" x1="46" y1="268" x2="46" y2="230" marker-end="url(#ak)"/>
      <line class="up" x1="0" y1="174" x2="0" y2="140" marker-end="url(#ak)"/>
    </g>
  </defs>

  <rect x="1" y="1" width="758" height="408" rx="16" fill="#f8fafc" stroke="#dde3ea"/>
  <text class="h" x="32" y="42">Memory neurons, unrolled over three decisions</text>
  <text class="sub" x="32" y="66">The last hidden layer is copied and fed back in at the next decision: a note the network writes to itself.</text>

  <use href="#col" xlink:href="#col" transform="translate(160 0)"/>
  <use href="#col" xlink:href="#col" transform="translate(380 0)"/>
  <use href="#col" xlink:href="#col" transform="translate(600 0)"/>

  <!-- memory carried forward -->
  <path class="mem" d="M36,286 L66,286" marker-end="url(#ag)"/>
  <path class="mem" d="M250,200 C276,200 262,286 286,286" marker-end="url(#ag)"/>
  <path class="mem" d="M470,200 C496,200 482,286 506,286" marker-end="url(#ag)"/>
  <path class="mem" d="M690,200 L730,200" marker-end="url(#ag)"/>

  <!-- time axis -->
  <line x1="60" y1="334" x2="712" y2="334" stroke="#9aa7b4" stroke-width="1.3" marker-end="url(#ak)"/>
  <g stroke="#9aa7b4" stroke-width="1.3"><line x1="160" y1="329" x2="160" y2="339"/><line x1="380" y1="329" x2="380" y2="339"/><line x1="600" y1="329" x2="600" y2="339"/></g>
  <text class="lab" x="160" y="358" text-anchor="middle">decision t−1</text>
  <text class="lab" x="380" y="358" text-anchor="middle">decision t</text>
  <text class="lab" x="600" y="358" text-anchor="middle">decision t+1</text>
  <text class="sm" x="712" y="324" text-anchor="end">40 ms apart</text>

  <path class="mem" d="M34,388 L70,388"/>
  <text class="sm" x="80" y="392">copied forward: at launch the memory starts at zero, then each decision passes its hidden layer on to the next.</text>
</svg>
