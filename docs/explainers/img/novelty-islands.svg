<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">
  <title id="t">Novelty islands: explorers and miners in one ring</title>
  <desc id="d">Eight islands sit in a ring. Islands 1, 3, 5 and 7 rank their tries by score. Islands 2, 4, 6 and 8 rank by the average of the score rank and the novelty rank. Arrows around the ring show migration: every 10 generations each island passes its best network to the next. A side table shows that on a novelty island a try that is good and new ranks above one that only scores best.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1d2733; }
    .h { font-size: 19px; font-weight: 600; }
    .sub { font-size: 13px; fill: #5b6b7a; }
    .ph { font-size: 15px; font-weight: 600; }
    .lab { font-size: 13px; }
    .b { font-weight: 600; }
    .sm { font-size: 12px; fill: #5b6b7a; }
    .tick { font-size: 12px; fill: #5b6b7a; }
    .axis { stroke: #9aa7b4; stroke-width: 1.3; }
    .rew { fill: #e3f0f8; stroke: #2b8cc4; stroke-width: 2; }
    .nov { fill: #e2f3ea; stroke: #3aa76d; stroke-width: 2; }
    .mig { fill: none; stroke: #5b6b7a; stroke-width: 1.8; }
  </style>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="758" height="418" rx="16" fill="#f8fafc" stroke="#dde3ea"/>
  <text class="h" x="32" y="42">Novelty islands: explorers and miners in one ring</text>
  <text class="sub" x="32" y="66">Every other island also ranks by novelty. Migration passes each island's best on, as without them.</text>

  <circle cx="216" cy="236" r="116" fill="none" stroke="#e6ebf0" stroke-width="10"/>
  <!-- migration: each island passes its best to the next -->
  <g class="mig" marker-end="url(#ak)">
    <path d="M246.6,124.1 A116,116 0 0 1 273.5,135.2"/>
    <path d="M316.8,178.5 A116,116 0 0 1 327.9,205.4"/>
    <path d="M327.9,266.6 A116,116 0 0 1 316.8,293.5"/>
    <path d="M273.5,336.8 A116,116 0 0 1 246.6,347.9"/>
    <path d="M185.4,347.9 A116,116 0 0 1 158.5,336.8"/>
    <path d="M115.2,293.5 A116,116 0 0 1 104.1,266.6"/>
    <path d="M104.1,205.4 A116,116 0 0 1 115.2,178.5"/>
    <path d="M158.5,135.2 A116,116 0 0 1 185.4,124.1"/>
  </g>
  <circle class="rew" cx="216" cy="120" r="25"/><text class="ph" x="216" y="125" text-anchor="middle">1</text>
  <circle class="nov" cx="298" cy="154" r="25"/><text class="ph" x="298" y="159" text-anchor="middle">2</text>
  <circle class="rew" cx="332" cy="236" r="25"/><text class="ph" x="332" y="241" text-anchor="middle">3</text>
  <circle class="nov" cx="298" cy="318" r="25"/><text class="ph" x="298" y="323" text-anchor="middle">4</text>
  <circle class="rew" cx="216" cy="352" r="25"/><text class="ph" x="216" y="357" text-anchor="middle">5</text>
  <circle class="nov" cx="134" cy="318" r="25"/><text class="ph" x="134" y="323" text-anchor="middle">6</text>
  <circle class="rew" cx="100" cy="236" r="25"/><text class="ph" x="100" y="241" text-anchor="middle">7</text>
  <circle class="nov" cx="134" cy="154" r="25"/><text class="ph" x="134" y="159" text-anchor="middle">8</text>
  <text class="sm" x="216" y="230" text-anchor="middle">every 10 generations,</text>
  <text class="sm" x="216" y="247" text-anchor="middle">each island's best</text>
  <text class="sm" x="216" y="264" text-anchor="middle">moves to the next</text>

  <rect x="380" y="88" width="348" height="290" rx="12" fill="#ffffff" stroke="#e3e8ee"/>
  <circle cx="404" cy="117" r="9" class="rew"/><text class="lab b" x="422" y="114">Reward islands</text>
  <text class="lab" x="422" y="132">rank by score (plus the novelty bonus, if on).</text>
  <circle cx="404" cy="163" r="9" class="nov"/><text class="lab b" x="422" y="160">Novelty islands</text>
  <text class="lab" x="422" y="178">rank by the average of two ranks:</text>
  <text class="lab" x="422" y="196">score rank and novelty rank.</text>

  <text class="sm b" x="398" y="228" style="fill:#1d2733">On a novelty island (1 is best)</text>
  <g class="sm" text-anchor="middle">
    <text x="416" y="252">try</text><text x="486" y="252">score rank</text><text x="578" y="252">novelty rank</text><text x="670" y="252">average</text>
  </g>
  <line x1="398" y1="260" x2="712" y2="260" stroke="#e3e8ee"/>
  <g class="lab" text-anchor="middle">
    <text x="416" y="280">A</text><text x="486" y="280">1</text><text x="578" y="280">8</text><text x="670" y="280">4.5</text>
  </g>
  <g class="lab b" text-anchor="middle">
    <text x="416" y="302" style="fill:#1f7a4a">B</text><text x="486" y="302" style="fill:#1f7a4a">3</text><text x="578" y="302" style="fill:#1f7a4a">2</text><text x="670" y="302" style="fill:#1f7a4a">2.5</text>
  </g>
  <g class="lab" text-anchor="middle">
    <text x="416" y="324">C</text><text x="486" y="324">2</text><text x="578" y="324">5</text><text x="670" y="324">3.5</text>
  </g>
  <text class="sm" x="398" y="346">B ranks first: good and new. A scores best, but its</text>
  <text class="sm" x="398" y="362">kind of flight is common.</text>

  <text class="sm" x="32" y="404">Reach and Intercept, with islands on. The novelty archive is the one the novelty bonus uses.</text>
</svg>
