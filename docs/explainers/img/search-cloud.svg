<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="t d">
  <title id="t">Two ways to shape the cloud of tries</title>
  <desc id="d">Two panels show the same tilted valley of good scores. On the left, sep-CMA-ES spreads its tries in a cloud that can only stretch along each weight's own axis, so it lies flat across the valley. On the right, LM-MA-ES stretches its cloud along a learned favourite direction that runs down the valley toward the best score.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1d2733; }
    .h { font-size: 19px; font-weight: 600; }
    .sub { font-size: 13px; fill: #5b6b7a; }
    .ph { font-size: 15px; font-weight: 600; }
    .lab { font-size: 13px; }
    .sm { font-size: 12px; fill: #5b6b7a; }
    .ring { fill: none; stroke: #cfd7df; stroke-width: 1.3; }
    .try { fill: #2b8cc4; }
  </style>
  <defs>
    <clipPath id="cl"><rect x="32" y="84" width="340" height="260" rx="12"/></clipPath>
    <clipPath id="cr"><rect x="388" y="84" width="340" height="260" rx="12"/></clipPath>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3aa76d"/>
    </marker>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa7b4"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="758" height="428" rx="16" fill="#f8fafc" stroke="#dde3ea"/>
  <text class="h" x="32" y="42">Two ways to shape the cloud of tries</text>
  <text class="sub" x="32" y="66">Each blue dot is one try: the centre plus a random nudge. Grey rings: the score landscape.</text>

  <!-- left panel: sep-CMA-ES -->
  <rect x="32" y="84" width="340" height="260" rx="12" fill="#ffffff" stroke="#e3e8ee"/>
  <g clip-path="url(#cl)">
    <g transform="rotate(-30 242 194)">
      <ellipse class="ring" cx="242" cy="194" rx="150" ry="48"/>
      <ellipse class="ring" cx="242" cy="194" rx="100" ry="31"/>
      <ellipse class="ring" cx="242" cy="194" rx="52" ry="15"/>
    </g>
  </g>
  <path d="M242,185 l2.6,5.4 5.9,0.8 -4.3,4.1 1,5.9 -5.2,-2.8 -5.2,2.8 1,-5.9 -4.3,-4.1 5.9,-0.8 z" fill="#e4572e"/>
  <ellipse cx="164" cy="239" rx="58" ry="25" fill="#2b8cc4" fill-opacity="0.10" stroke="#2b8cc4" stroke-width="1.5"/>
  <g class="try">
    <circle cx="131" cy="243.5" r="3.6"/><circle cx="190.9" cy="232.8" r="3.6"/><circle cx="128.1" cy="238.2" r="3.6"/>
    <circle cx="176.9" cy="252.2" r="3.6"/><circle cx="131.2" cy="223.5" r="3.6"/><circle cx="183.1" cy="244.7" r="3.6"/>
    <circle cx="205.4" cy="250.8" r="3.6"/><circle cx="161.3" cy="235.7" r="3.6"/><circle cx="142.8" cy="225.3" r="3.6"/>
    <circle cx="154.7" cy="238.3" r="3.6"/>
  </g>
  <circle cx="164" cy="239" r="5" fill="#1d2733"/>
  <text class="ph" x="50" y="112">sep-CMA-ES</text>
  <text class="sm" x="50" y="131">one width per weight</text>
  <line x1="52" y1="326" x2="104" y2="326" stroke="#9aa7b4" stroke-width="1.3" marker-end="url(#ax)"/>
  <line x1="52" y1="326" x2="52" y2="286" stroke="#9aa7b4" stroke-width="1.3" marker-end="url(#ax)"/>
  <text class="sm" x="110" y="330">weight 1</text>
  <text class="sm" x="60" y="292">weight 2</text>

  <!-- right panel: LM-MA-ES -->
  <rect x="388" y="84" width="340" height="260" rx="12" fill="#ffffff" stroke="#e3e8ee"/>
  <g clip-path="url(#cr)">
    <g transform="rotate(-30 598 194)">
      <ellipse class="ring" cx="598" cy="194" rx="150" ry="48"/>
      <ellipse class="ring" cx="598" cy="194" rx="100" ry="31"/>
      <ellipse class="ring" cx="598" cy="194" rx="52" ry="15"/>
    </g>
  </g>
  <path d="M598,185 l2.6,5.4 5.9,0.8 -4.3,4.1 1,5.9 -5.2,-2.8 -5.2,2.8 1,-5.9 -4.3,-4.1 5.9,-0.8 z" fill="#e4572e"/>
  <ellipse cx="520" cy="239" rx="62" ry="13" transform="rotate(-30 520 239)" fill="#2b8cc4" fill-opacity="0.10" stroke="#2b8cc4" stroke-width="1.5"/>
  <g class="try">
    <circle cx="490.4" cy="258.7" r="3.6"/><circle cx="543.4" cy="221.9" r="3.6"/><circle cx="486.4" cy="257.9" r="3.6"/>
    <circle cx="535.3" cy="237.8" r="3.6"/><circle cx="485.6" cy="249.9" r="3.6"/><circle cx="539.2" cy="231.2" r="3.6"/>
    <circle cx="561.5" cy="221.9" r="3.6"/><circle cx="496.9" cy="244.5" r="3.6"/><circle cx="511.2" cy="243.7" r="3.6"/>
  </g>
  <line x1="520" y1="239" x2="584" y2="202" stroke="#3aa76d" stroke-width="2.6" marker-end="url(#ah)"/>
  <circle cx="520" cy="239" r="5" fill="#1d2733"/>
  <text class="ph" x="406" y="112">LM-MA-ES</text>
  <text class="sm" x="406" y="131">plus a few learned favourite directions</text>
  <text class="lab" x="596" y="250" fill="#1f7a4a" style="fill:#1f7a4a">favourite</text>
  <text class="lab" x="596" y="267" style="fill:#1f7a4a">direction</text>
  <line x1="408" y1="326" x2="460" y2="326" stroke="#9aa7b4" stroke-width="1.3" marker-end="url(#ax)"/>
  <line x1="408" y1="326" x2="408" y2="286" stroke="#9aa7b4" stroke-width="1.3" marker-end="url(#ax)"/>
  <text class="sm" x="466" y="330">weight 1</text>
  <text class="sm" x="416" y="292">weight 2</text>

  <!-- captions -->
  <text class="lab" x="32" y="372">Stretches only along each weight's own axis.</text>
  <text class="lab" x="388" y="372">Also stretches along mixes of weights.</text>
  <circle cx="38" cy="401" r="5" fill="#1d2733"/>
  <text class="sm" x="50" y="405">centre (current best guess)</text>
  <path d="M236,396 l2.6,5.4 5.9,0.8 -4.3,4.1 1,5.9 -5.2,-2.8 -5.2,2.8 1,-5.9 -4.3,-4.1 5.9,-0.8 z" fill="#e4572e"/>
  <text class="sm" x="250" y="405">best score</text>
  <text class="sm" x="388" y="405">Automatic: sep-CMA-ES up to 2,000 weights, LM-MA-ES above.</text>
</svg>
