<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="t d">
  <title id="t">Head start: copy the teacher, then learn from your own mistakes</title>
  <desc id="d">Three panels. Round 1: the guidance algorithm flies from the pad to the target while every decision is recorded. A plain copy then drifts off the teacher's path into states it never saw. Rounds 2 and 3: the copy flies and, at every state it reaches, the teacher shows how it would steer back; the network is fitted again on all the data.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1d2733; }
    .h { font-size: 19px; font-weight: 600; }
    .sub { font-size: 13px; fill: #5b6b7a; }
    .ph { font-size: 15px; font-weight: 600; }
    .sm { font-size: 12px; fill: #5b6b7a; }
    .panel { fill: #ffffff; stroke: #e3e8ee; }
    .teach { fill: none; stroke: #1d2733; stroke-width: 2.4; }
    .ghost { fill: none; stroke: #cfd7df; stroke-width: 2.4; }
    .stud { fill: none; stroke: #2b8cc4; stroke-width: 2.4; }
    .fix { stroke: #3aa76d; stroke-width: 2.2; }
    .pad { fill: #9aa7b4; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3aa76d"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="758" height="428" rx="16" fill="#f8fafc" stroke="#dde3ea"/>
  <text class="h" x="32" y="42">Head start: copy the teacher, then learn from your own mistakes</text>
  <text class="sub" x="32" y="66">Behaviour cloning with DAgger. The teacher is the guidance algorithm, the student is the new network.</text>

  <!-- 1: the teacher flies, every decision is recorded -->
  <rect class="panel" x="32" y="84" width="220" height="300" rx="12"/>
  <text class="ph" x="48" y="110">Round 1</text>
  <text class="sm" x="48" y="128">the teacher flies</text>
  <rect class="pad" x="50" y="322" width="24" height="5" rx="2"/>
  <circle cx="218" cy="174" r="9" fill="#ffffff" stroke="#e4572e" stroke-width="2"/><circle cx="218" cy="174" r="3" fill="#e4572e"/>
  <path class="teach" d="M62,320 C70,230 142,174 218,174"/>
  <g fill="#1d2733">
    <circle cx="67.9" cy="287.9" r="3.5"/><circle cx="79.1" cy="259.2" r="3.5"/><circle cx="94.8" cy="234.3" r="3.5"/>
    <circle cx="114.5" cy="213.2" r="3.5"/><circle cx="137.4" cy="196.5" r="3.5"/><circle cx="162.7" cy="184.2" r="3.5"/>
    <circle cx="189.8" cy="176.6" r="3.5"/>
  </g>
  <text class="sm" x="48" y="352">Each dot is saved: what the ball</text>
  <text class="sm" x="48" y="369">senses, and what the teacher did.</text>

  <!-- 2: a plain copy drifts into states it never saw -->
  <rect class="panel" x="270" y="84" width="220" height="300" rx="12"/>
  <text class="ph" x="286" y="110">A plain copy</text>
  <text class="sm" x="286" y="128">drifts off the path</text>
  <rect class="pad" x="288" y="322" width="24" height="5" rx="2"/>
  <ellipse cx="432" cy="153" rx="52" ry="18" transform="rotate(-17 432 153)" fill="#e4572e" fill-opacity="0.12" stroke="#e4572e" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="456" cy="174" r="9" fill="#ffffff" stroke="#e4572e" stroke-width="2"/><circle cx="456" cy="174" r="3" fill="#e4572e"/>
  <path class="ghost" d="M300,320 C308,230 380,174 456,174"/>
  <path class="stud" d="M300,320 C304,246 348,162 466,140"/>
  <text class="sm" x="424" y="206" text-anchor="middle" style="fill:#b8401c">never seen</text>
  <text class="sm" x="286" y="352">Small errors lead to states it</text>
  <text class="sm" x="286" y="369">never saw, and they snowball.</text>

  <!-- 3: the student flies, the teacher labels its states -->
  <rect class="panel" x="508" y="84" width="220" height="300" rx="12"/>
  <text class="ph" x="524" y="110">Rounds 2–3</text>
  <text class="sm" x="524" y="128">the student flies, the teacher labels</text>
  <rect class="pad" x="526" y="322" width="24" height="5" rx="2"/>
  <circle cx="694" cy="174" r="9" fill="#ffffff" stroke="#e4572e" stroke-width="2"/><circle cx="694" cy="174" r="3" fill="#e4572e"/>
  <path class="ghost" d="M538,320 C546,230 618,174 694,174"/>
  <path class="stud" d="M538,320 C542,246 586,162 704,140"/>
  <g class="fix" marker-end="url(#ag)">
    <line x1="578.2" y1="210.5" x2="588.5" y2="212.8"/>
    <line x1="600.7" y1="187.1" x2="611.4" y2="195"/>
    <line x1="628.8" y1="167" x2="637.4" y2="181.9"/>
    <line x1="663.2" y1="151" x2="665.5" y2="174"/>
    <line x1="704" y1="140" x2="696" y2="166"/>
  </g>
  <text class="sm" x="524" y="352">Green: how the teacher would steer</text>
  <text class="sm" x="524" y="369">from there. Fit again on all of it.</text>

  <text class="sm" x="32" y="410">Up to 60,000 decisions, about 3 s of fitting per round. Evolution then starts from a network that already flies.</text>
</svg>
